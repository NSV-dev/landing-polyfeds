name: Deploy production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit SHA tested on GitHub Pages
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
      PRODUCTION_WEBROOT: ${{ secrets.PRODUCTION_WEBROOT }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
    steps:
      - name: Validate requested revision
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Commit must be a 7-40 character hexadecimal SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0

      - name: Confirm commit is on main and validate site
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "The selected commit does not belong to main." >&2
            exit 1
          }
          test -s index.html
          test -s styles.css
          test -s script.js
          test -d assets

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_PATH"
          test -n "$PRODUCTION_WEBROOT"
          test -n "$PRODUCTION_URL"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          [[ "$PRODUCTION_PATH" == /* ]] || {
            echo "PRODUCTION_PATH must be an absolute server path." >&2
            exit 1
          }
          [[ "$PRODUCTION_WEBROOT" == /* ]] || {
            echo "PRODUCTION_WEBROOT must be an absolute server path." >&2
            exit 1
          }
          [[ "$PRODUCTION_PATH" != "$PRODUCTION_WEBROOT" ]] || {
            echo "PRODUCTION_PATH and PRODUCTION_WEBROOT must be different." >&2
            exit 1
          }
          [[ "$PRODUCTION_PATH" != "/" ]] || {
            echo "PRODUCTION_PATH must not be the filesystem root." >&2
            exit 1
          }
          [[ "$PRODUCTION_PATH" != *[[:space:]]* && "$PRODUCTION_WEBROOT" != *[[:space:]]* ]] || {
            echo "Production paths must not contain whitespace." >&2
            exit 1
          }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release and switch public root atomically
        run: |
          RELEASE="$(git rev-parse HEAD)"
          REMOTE="$PRODUCTION_USER@$PRODUCTION_HOST"
          RELEASE_PATH="$PRODUCTION_PATH/releases/$RELEASE"
          ACTIVE_RELEASE="$(ssh "$REMOTE" "readlink -f '$PRODUCTION_WEBROOT' 2>/dev/null || true")"
          LINK_DEST=()

          if [[ "$ACTIVE_RELEASE" == "$PRODUCTION_PATH"/releases/* ]]; then
            LINK_DEST=(--link-dest="$ACTIVE_RELEASE")
            echo "Reusing unchanged files from $ACTIVE_RELEASE"
          else
            echo "No eligible active release found; performing a full upload."
          fi

          ssh "$REMOTE" "mkdir -p '$RELEASE_PATH'"
          rsync -rlc --delete --stats \
            "${LINK_DEST[@]}" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'README.md' \
            ./ "$REMOTE:$RELEASE_PATH/"
          ssh "$REMOTE" "set -eu; test -s '$RELEASE_PATH/index.html'; ln -sfn '$RELEASE_PATH' '$PRODUCTION_WEBROOT.next'; mv -Tf '$PRODUCTION_WEBROOT.next' '$PRODUCTION_WEBROOT'"

      - name: Verify production
        run: curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$PRODUCTION_URL"

      - name: Keep active release and five rollback releases
        run: |
          REMOTE="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh "$REMOTE" bash -s -- "$PRODUCTION_PATH" "$PRODUCTION_WEBROOT" <<'REMOTE_SCRIPT'
          set -euo pipefail

          production_path="$1"
          production_webroot="$2"
          releases_dir="$(readlink -f -- "$production_path/releases")"
          active_release="$(readlink -f -- "$production_webroot")"

          [[ -n "$releases_dir" && "$releases_dir" != "/" && -d "$releases_dir" ]]
          [[ "$active_release" == "$releases_dir/"* && -s "$active_release/index.html" ]]

          mapfile -t inactive_releases < <(
            find "$releases_dir" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' |
              sort -rn |
              cut -d ' ' -f2- |
              while IFS= read -r release_dir; do
                resolved_release="$(readlink -f -- "$release_dir")"
                if [[ "$resolved_release" != "$active_release" ]]; then
                  printf '%s\n' "$resolved_release"
                fi
              done
          )

          pruned=0
          for ((index = 5; index < ${#inactive_releases[@]}; index++)); do
            release_to_delete="${inactive_releases[$index]}"
            [[ "$release_to_delete" == "$releases_dir/"* ]]
            [[ "$release_to_delete" != "$active_release" ]]
            [[ "$(dirname -- "$release_to_delete")" == "$releases_dir" ]]
            rm -rf -- "$release_to_delete"
            printf 'Pruned old release: %s\n' "$(basename -- "$release_to_delete")"
            ((pruned += 1))
          done

          printf 'Retention complete: active release plus %d rollback release(s); %d pruned.\n' \
            "$((${#inactive_releases[@]} < 5 ? ${#inactive_releases[@]} : 5))" "$pruned"
          REMOTE_SCRIPT

      - name: Publish deployment summary
        run: |
          echo "### Production deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
