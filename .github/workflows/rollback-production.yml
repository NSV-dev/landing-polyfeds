name: Rollback production

on:
  workflow_dispatch:
    inputs:
      release:
        description: Full commit SHA of an existing server release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    environment: production
    runs-on: ubuntu-latest
    env:
      PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
      PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
      PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
      PRODUCTION_WEBROOT: ${{ secrets.PRODUCTION_WEBROOT }}
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      RELEASE: ${{ inputs.release }}
    steps:
      - name: Validate release
        run: |
          if [[ ! "$RELEASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Release must be a full 40-character commit SHA." >&2
            exit 1
          fi
          [[ "$PRODUCTION_PATH" == /* ]] || exit 1
          [[ "$PRODUCTION_WEBROOT" == /* ]] || exit 1
          [[ "$PRODUCTION_PATH" != "$PRODUCTION_WEBROOT" ]] || exit 1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          test -n "$PRODUCTION_HOST"
          test -n "$PRODUCTION_USER"
          test -n "$PRODUCTION_PATH"
          test -n "$PRODUCTION_WEBROOT"
          test -n "$PRODUCTION_URL"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Switch public root to existing release
        run: |
          REMOTE="$PRODUCTION_USER@$PRODUCTION_HOST"
          ssh "$REMOTE" "set -eu; test -s '$PRODUCTION_PATH/releases/$RELEASE/index.html'; ln -sfn '$PRODUCTION_PATH/releases/$RELEASE' '$PRODUCTION_WEBROOT.next'; mv -Tf '$PRODUCTION_WEBROOT.next' '$PRODUCTION_WEBROOT'"

      - name: Verify production
        run: curl --fail --silent --show-error --location --retry 4 --retry-delay 3 "$PRODUCTION_URL"

      - name: Publish rollback summary
        run: |
          echo "### Production rolled back" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`$RELEASE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
